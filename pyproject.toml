[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-tool"
version = "0.1.0"
description = "Cross-platform GitLab automation CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-gitlab>=4.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
gitlab-tool = "gitlab_cli:app_entry"

[tool.setuptools]
py-modules = ["gitlab_cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]
